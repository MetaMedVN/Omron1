<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Omron Hospital Approaching Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one 1280x800 swimlane canvas (Hedima | Omron | Clinical | Communications | BOD & Procurement) across 8 stages, scaled to fit; hospital status strip below; step detail panel on the right. */
:root{
  --bg:#FFFFFF; --surface:#F2F6F7; --ink:#0E1A2B; --muted:#5B6878; --line:#CDD6DE; --wire:#A7B3BF;
  --blue:#0447C3; --blue-soft:#E7EEFB; --green:#06925A; --green-soft:#E2F5EB;
  --red:#D9483F; --red-soft:#FDECEA; --amber:#B7791F; --amber-soft:#FFF5E3; --amber-ink:#7A4E0E;
  --plate:#FFFFFF; --on-accent:#FFFFFF; --shadow:rgba(4,71,195,.14);
  --display:"Be Vietnam Pro","Manrope",Arial,sans-serif; --body:"Manrope","Be Vietnam Pro",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1420; --surface:#142030; --ink:#E5ECF4; --muted:#93A2B4; --line:#2A3A4E; --wire:#4A5B70;
  --blue:#86A8FF; --blue-soft:#17264A; --green:#4FD08E; --green-soft:#0F2E22;
  --red:#FF7E74; --red-soft:#3A1D1F; --amber:#E5AA4E; --amber-soft:#2E2415; --amber-ink:#F2CD8E;
  --plate:#F4F7FA; --on-accent:#0C1420; --shadow:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1420; --surface:#142030; --ink:#E5ECF4; --muted:#93A2B4; --line:#2A3A4E; --wire:#4A5B70;
  --blue:#86A8FF; --blue-soft:#17264A; --green:#4FD08E; --green-soft:#0F2E22;
  --red:#FF7E74; --red-soft:#3A1D1F; --amber:#E5AA4E; --amber-soft:#2E2415; --amber-ink:#F2CD8E;
  --plate:#F4F7FA; --on-accent:#0C1420; --shadow:rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%;background:var(--bg)}
body{margin:0;box-sizing:border-box;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--body);color:var(--ink);overflow:hidden}
.viewport{width:100%;height:100%;position:relative}
.stage{width:1280px;height:800px;transform-origin:top left;position:absolute;top:0;left:0;background:var(--bg);overflow:hidden}
.top,.flow,.bot{position:absolute;width:1280px;left:0}
.top{top:0;height:96px}
.flow{top:0;height:800px;pointer-events:none}
.flow>*{pointer-events:auto}
.flow svg.wires{pointer-events:none}
.bot{top:756px;height:44px}

header{position:absolute;left:40px;top:12px;width:600px}
h1{white-space:nowrap}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--green);text-transform:uppercase}
h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.15;margin:6px 0 0}
.narr{position:absolute;left:40px;top:76px;width:920px;font-size:12px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.narr strong{color:var(--green)}
.narr strong.r{color:var(--red)} .narr strong.b{color:var(--blue)}

.controls{position:absolute;right:36px;top:50px;display:flex;align-items:center;gap:6px}
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-right:4px}
.chip{font:700 11.5px var(--body);border:1.5px solid var(--green);background:var(--bg);color:var(--green);border-radius:999px;padding:5px 10px;white-space:nowrap;cursor:pointer;transition:background .2s,color .2s}
.chip.red{border-color:var(--red);color:var(--red)}
.chip.blue{border-color:var(--blue);color:var(--blue)}
.chip:hover,.chip.act{background:var(--green);color:var(--on-accent)}
.chip.red:hover,.chip.red.act{background:var(--red);color:var(--on-accent)}
.chip.blue:hover,.chip.blue.act{background:var(--blue);color:var(--on-accent)}
.chip.ghost{border-color:var(--line);color:var(--muted)}
.chip.ghost:hover{background:var(--surface);color:var(--ink)}
.chip:focus-visible,.seg button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.toggles{position:absolute;right:36px;top:10px;display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{font:800 10.5px var(--body);letter-spacing:.06em;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:4px 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fs{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.fs:hover{border-color:var(--green);color:var(--green)}
.fs:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.fs svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

svg.wires{position:absolute;left:0;top:0;width:1280px;height:800px}
.band{fill:var(--surface);stroke:var(--line);stroke-width:1}
.band.alt{fill:var(--bg)}
.mk{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mk-n{stroke:var(--green)} .mk-o{stroke:var(--red)} .mk-a{stroke:var(--amber)} .mk-b{stroke:var(--blue)} .mk-s{stroke:var(--wire)}
.wire{stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s,opacity .3s,stroke-width .3s}
.wire.new{stroke:var(--green)}
.wire.old{stroke:var(--red);stroke-dasharray:4 4}
.wire.risk{stroke:var(--amber);stroke-dasharray:5 4}
.wire.side{stroke:var(--blue);stroke-dasharray:5 4}
.wire.sup{stroke:var(--wire);stroke-dasharray:2 4}
.wire.on{stroke-width:2.6;stroke-dasharray:0}
.dim .wire:not(.on){opacity:.15}
.wlabel{font:700 10px var(--body);fill:var(--muted);letter-spacing:.02em;transition:opacity .3s}
.wlabel.r{fill:var(--red)}
.dim .wlabel{opacity:.25}
.dim .wlabel.on{opacity:1}
.axis{font:800 9.5px var(--body);letter-spacing:.1em;text-transform:uppercase}
.axis.p1{fill:var(--green)} .axis.p2{fill:var(--blue)} .axis.p3{fill:var(--ink)}
.pline{stroke-width:2.5;stroke-linecap:round}
.pline.p1{stroke:var(--green)} .pline.p2{stroke:var(--blue)} .pline.p3{stroke:var(--ink)}

.lanehd{position:absolute;left:38px;width:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.lanehd .av{width:38px;height:38px;border-radius:50%;background:var(--plate);border:1.5px solid var(--line);display:grid;place-items:center}
.lanehd .av svg{width:20px;height:20px;fill:none;stroke:#2FA866;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lanehd b{font-family:var(--display);font-size:12px;font-weight:800;line-height:1.15}
.lanehd small{font-size:9.5px;color:var(--muted);line-height:1.2}

.node{position:absolute;box-sizing:border-box;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 5px 7px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);transition:transform .2s,border-color .3s,background .3s,opacity .3s,box-shadow .3s;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.nb{white-space:nowrap}
.node b{font-family:var(--display);font-size:11.5px;font-weight:700;line-height:1.18}
.node small{font-size:9.5px;color:var(--muted);line-height:1.22}
.node.new{background:var(--green-soft);border-color:var(--green)}
.node.key{box-shadow:0 0 0 3px var(--green-soft),0 0 0 4.5px var(--green)}
.node.old{background:var(--red-soft);border-color:var(--red);border-style:dashed}
.node.old b{color:var(--red)}
.node.risk{background:var(--amber-soft);border-color:var(--amber);border-style:dashed}
.node.side{background:var(--blue-soft);border-color:var(--blue);border-style:dashed}
.node .ch{position:absolute;top:-8px;right:6px;font-size:8.5px;font-weight:800;letter-spacing:.08em;padding:1px 6px;border-radius:999px;background:var(--bg);border:1px solid currentColor;text-transform:uppercase;white-space:nowrap}
.ch.csow{color:var(--ink)} .ch.cnew{color:var(--green)} .ch.cold{color:var(--red)} .ch.crisk{color:var(--amber)} .ch.cside{color:var(--blue)} .ch.com{color:var(--muted)}
.node .kpi{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);font-size:8.5px;font-weight:800;letter-spacing:.1em;padding:1px 6px;border-radius:999px;background:var(--ink);color:var(--bg);white-space:nowrap;text-transform:uppercase}
.node:hover{transform:translateY(-2px);box-shadow:0 6px 16px var(--shadow)}
.node.key:hover{box-shadow:0 0 0 3px var(--green-soft),0 0 0 4.5px var(--green),0 6px 16px var(--shadow)}
.node:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.node.sel{outline:2.5px solid var(--blue);outline-offset:3px}
.dim .node:not(.on){opacity:.28}
.node.on{transform:translateY(-1px)}

.benhd{position:absolute;left:40px;top:630px;font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.ben{position:absolute;top:648px;height:100px;width:226px;box-sizing:border-box;border-top:3px solid var(--green);padding:8px 4px 0 0;display:flex;flex-direction:column;gap:3px}
.ben.hold{border-top-color:var(--amber)} .ben.rule{border-top-color:var(--ink)}
.ben .k{font-size:9.5px;font-weight:800;letter-spacing:.12em;color:var(--green);text-transform:uppercase}
.ben.hold .k{color:var(--amber)} .ben.rule .k{color:var(--ink)}
.ben b{font-family:var(--display);font-size:13px;line-height:1.2}
.ben p{margin:0;font-size:11px;line-height:1.4;color:var(--muted)}

aside{position:absolute;left:990px;top:104px;width:254px;height:644px;box-sizing:border-box;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:11px;overflow:auto}
aside .k{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--green);text-transform:uppercase}
aside h2{font-family:var(--display);font-size:18px;font-weight:800;margin:0;line-height:1.2;text-wrap:balance}
aside dl{margin:0;display:flex;flex-direction:column;gap:9px}
aside dt{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
aside dt.s{color:var(--green)} aside dt.w{color:var(--amber)} aside dt.o{color:var(--blue)} aside dt.c{color:var(--red)} aside dt.g{color:var(--ink)}
aside dd{margin:2px 0 0;font-size:12px;line-height:1.45}
aside .swoc{display:grid;grid-template-columns:1fr;gap:6px}
aside .q{border-radius:8px;padding:7px 9px}
aside .q.s{background:var(--green-soft)} aside .q.w{background:var(--amber-soft)} aside .q.o{background:var(--blue-soft)} aside .q.c{background:var(--red-soft)}
aside .q dd{margin:1px 0 0}
aside .gate{border:1.5px dashed var(--ink);border-radius:8px;padding:7px 9px}
.flag{background:var(--amber-soft);color:var(--amber-ink);border:1px dashed var(--amber);border-radius:8px;padding:7px 9px;font-size:11.5px;line-height:1.4}
.flag b{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.fun{display:flex;flex-direction:column;gap:6px}
.fun div{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.35}
.fun i{font-style:normal;flex:none;width:21px;height:21px;border-radius:50%;background:var(--green-soft);color:var(--green);font-weight:800;font-size:10.5px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.fun i.p2{background:var(--blue-soft);color:var(--blue)} .fun i.p3{background:var(--surface);color:var(--ink)}
.c-r{color:var(--red)} .c-g{color:var(--green)} .c-b{color:var(--blue)}

.legend{position:absolute;left:40px;bottom:12px;display:flex;gap:16px;font-size:11px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-3px;margin-right:5px;border:1.5px solid var(--line);background:var(--bg)}
.sw.n{background:var(--green-soft);border-color:var(--green)}
.sw.o{background:var(--red-soft);border-color:var(--red);border-style:dashed}
.sw.a{background:var(--amber-soft);border-color:var(--amber);border-style:dashed}
.sw.b{background:var(--blue-soft);border-color:var(--blue);border-style:dashed}
.note{position:absolute;right:36px;bottom:12px;font-size:10.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  </svg>

  <div class="lanehd" style="top:126px;height:84px"><span class="av"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span><b>Hedima</b><small data-i="lnHs"></small></div>

let lang='vi';
const T=v=>Array.isArray(v)?v[lang==='vi'?0:1]:v;
const UI={
 eyebrow:"Omron x Hedima | Stroke prevention & AFib screening",
 title:"Hospital Approaching Flow",
 play:"Play journey", reset:["Đặt lại","Reset"], light:["Sáng","Light"], dark:["Tối","Dark"],
 sA:["Push | Hiện tại","Push | Today"], sB:["Từng bước | Đề xuất Hedima","Step by step | Hedima proposal"], sC:["Side door | Stroke Conf.","Side door | Stroke Conf."],

 lnHs:["Agency | Quan hệ","Agency | Relationships"],

function rpath(P,R=7){let d='M'+P[0][0]+','+P[0][1];for(let i=1;i<P.length-1;i++){const [x0,y0]=P[i-1],[x1,y1]=P[i],[x2,y2]=P[i+1];const r=Math.min(R,Math.hypot(x1-x0,y1-y0)/2,Math.hypot(x2-x1,y2-y1)/2);const ax=x1-Math.sign(x1-x0)*r,ay=y1-Math.sign(y1-y0)*r,bx=x1+Math.sign(x2-x1)*r,by=y1+Math.sign(y2-y1)*r;d+=' L'+ax+','+ay+' Q'+x1+','+y1+' '+bx+','+by}const L=P[P.length-1];return d+' L'+L[0]+','+L[1]}

for(const id in N){const n=N[id],b=document.createElement('button');b.className='node '+(n.cls||'');b.id='n-'+id;
 Object.assign(b.style,{left:CX[n.c]+'px',top:LY[n.l]+'px',width:'84px',height:'66px'});b.onclick=()=>show(id);nodes.appendChild(b)}
const seg=x=>{x=String(x);if(x.indexOf(' | ')<0)return x;const a=x.split(' | ');return a.map((p,i)=>'<span class="nb">'+p+(i<a.length-1?' |':'')+'</span>').join(' ')};
function renderAxis(){ag.innerHTML='';STG.forEach((s,i)=>{const t=document.createElementNS(SVGNS,'text');t.setAttribute('x',CX[i]+42);t.setAttribute('y',111);t.setAttribute('text-anchor','middle');t.setAttribute('class','axis '+(i<4?'p1':i<6?'p2':'p3'));t.textContent=T(s);ag.appendChild(t)})}
function renderNodes(){for(const id in N){const n=N[id],b=document.getElementById('n-'+id);
 b.innerHTML='<b>'+seg(T(n.t))+'</b>'+(n.s?'<small>'+seg(T(n.s))+'</small>':'')
  +(n.ch?'<span class="ch '+n.ch[0]+'">'+T(n.ch[1])+'</span>':'')+(n.kpi?'<span class="kpi">'+T(n.kpi)+'</span>':'')}
 bens.innerHTML=BEN.map((x,i)=>'<div class="ben '+x.cls+'" style="left:'+(40+i*232)+'px"><span class="k">'+T(x.k)+'</span><b>'+T(x.t)+'</b><p>'+T(x.p)+'</p></div>').join('')}
function overview(){panel.innerHTML=lang==='vi'
 ?'<div class="k">Cách đọc</div><h2>Mỗi điểm chạm chỉ xin một cái gật đầu</h2><dl><dd><b class="c-r">Push</b>: xin tích hợp thiết bị ngay từ buổi đầu. Phòng Truyền thông phải trình lãnh đạo, chưa có khoa nào đề xuất nên dễ bị từ chối.</dd><dd><b class="c-g">Từng bước</b>: 3 SOW đã ký là cầu nối tới bác sĩ. Khi có champion và nhu cầu thật, khoa tự đề xuất thiết bị.</dd><dd><b class="c-b">Side door</b>: hội nghị đột quỵ Hà Nội mở thêm kênh chuyên môn tới bệnh viện mới.</dd></dl><div class="k">3 giai đoạn</div><div class="fun"><div><i>1</i>Tạo niềm tin | Stage 0–3 | 3 SOW đã ký</div><div><i class="p2">2</i>Chứng minh giá trị | Stage 4–5 | Add-on</div><div><i class="p3">3</i>Bệnh viện làm chủ | Stage 6–7 | SOP, mua sắm</div></div><div class="flag"><b>Bấm vào từng bước</b>Xem Thế mạnh | Điểm yếu | Cơ hội | Khó khăn và điều kiện Gate để sang bước tiếp.</div>'
 :'<div class="k">How to read</div><h2>Each touchpoint asks for one yes</h2><dl><dd><b class="c-r">Push</b>: ask for device integration at the first meeting. Communications must escalate, no department has asked, so a decline is likely.</dd><dd><b class="c-g">Step by step</b>: the 3 contracted SOWs are the bridge to doctors. With a champion and real demand, the department requests devices itself.</dd><dd><b class="c-b">Side door</b>: the Hanoi stroke conference opens a clinical route to new hospitals.</dd></dl><div class="k">3 phases</div><div class="fun"><div><i>1</i>Earn trust | Stages 0–3 | 3 contracted SOWs</div><div><i class="p2">2</i>Prove value | Stages 4–5 | Add-on</div><div><i class="p3">3</i>Hospital-owned | Stages 6–7 | SOP, purchasing</div></div><div class="flag"><b>Click any step</b>See Strengths | Weaknesses | Opportunities | Challenges and the gate to the next step.</div>'}
let cur=null,playing=null,timers=[];
function show(id){cur=id;const n=N[id];document.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));document.getElementById('n-'+id).classList.add('sel');
 let h='<div class="k">'+T(LANE[n.ln])+(n.kpi?' | '+T(n.kpi):'')+'</div><h2>'+T(n.t)+'</h2><dl>';
 if(n.ask)h+='<div><dt>'+T(UI.ask)+'</dt><dd>'+T(n.ask)+'</dd></div>';
 (n.ex||[]).forEach(r=>h+='<div><dt>'+T(r[0])+'</dt><dd>'+T(r[1])+'</dd></div>');
 if(n.sw)h+='<div class="swoc">'+['S','W','O','C'].map((k,i)=>'<div class="q '+k.toLowerCase()+'"><dt class="'+k.toLowerCase()+'">'+T(UI[k])+'</dt><dd>'+T(n.sw[i])+'</dd></div>').join('')+'</div>';
 if(n.gate)h+='<div class="gate"><dt class="g">'+T(UI.gate)+'</dt><dd>'+T(n.gate)+'</dd></div>';
 h+='</dl>'+(n.f?'<div class="flag"><b>'+T(UI.confirm)+'</b>'+T(n.f)+'</div>':'');panel.innerHTML=h}
function clearRun(){timers.forEach(clearTimeout);timers=[];stage.classList.remove('dim');playing=null;
 document.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.chip').forEach(c=>c.classList.remove('act'))}
function lit(a,b){const w=document.getElementById('w-'+a+'-'+b);if(w)w.classList.add('on');document.querySelectorAll('[data-w="'+a+'-'+b+'"]').forEach(l=>l.classList.add('on'))}
function play(k){clearRun();if(k==='r'){cur=null;document.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));narr.innerHTML=T(UI.narr);overview();return}
 const sc=S[k],rm=matchMedia('(prefers-reduced-motion: reduce)').matches,step=rm?0:650;playing=k;
 document.getElementById('s-'+k).classList.add('act');stage.classList.add('dim');narr.innerHTML=T(sc.n);
 const steps=sc.p.map(it=>typeof it==='string'?{n:[it]}:it);
 steps.forEach((o,i)=>{const from=o.from||(i>0?steps[i-1].n:[]);timers.push(setTimeout(()=>{
   o.n.forEach(x=>{document.getElementById('n-'+x).classList.add('on');from.forEach(p=>lit(p,x));
     (o.also||[]).forEach(a=>{document.getElementById('n-'+a).classList.add('on');lit(a,x)})});
   show(o.n[0])},i*step))})}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>play(c.dataset.s));
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
function setLang(l){lang=l;document.documentElement.lang=l==='vi'?'vi':'en';
 document.querySelectorAll('[data-i]').forEach(el=>el.textContent=T(UI[el.dataset.i]));
 document.querySelectorAll('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
 renderAxis();renderNodes();if(cur)show(cur);else overview();narr.innerHTML=playing?T(S[playing].n):T(UI.narr);store('omr-lang',l)}
function curTheme(){const a=document.documentElement.dataset.theme;return a||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function setTheme(t,save){document.documentElement.dataset.theme=t;if(save)store('omr-theme',t);syncTheme()}
function syncTheme(){const t=curTheme();document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))}
document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>setTheme(b.dataset.t,true));
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',syncTheme);
const st=load('omr-theme');if(st==='light'||st==='dark')setTheme(st,false);else syncTheme();
setLang(load('omr-lang')==='en'?'en':'vi');
const vp=document.getElementById('vp');
function fit(){const W=vp.clientWidth,H=vp.clientHeight,sc=Math.min(W/1280,H/800),Ws=W/sc,Hs=H/sc,ox=(Ws-1280)/2,oy=Math.max(0,(Hs-800)/2);
 Object.assign(stage.style,{width:Ws+'px',height:Hs+'px',transform:'scale('+sc+')'});
 ['top','flow','bot'].forEach(id=>document.getElementById(id).style.left=ox+'px');['top','flow'].forEach(id=>document.getElementById(id).style.top=oy+'px');document.getElementById('bot').style.top=(oy+756)+'px'}
addEventListener('resize',fit);fit();
const fsb=document.getElementById('fs');
fsb.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){fsb.title=lang==='vi'?'Trình duyệt không cho phép toàn màn hình':'Fullscreen not available here'}};
document.addEventListener('fullscreenchange',()=>setTimeout(fit,50));
